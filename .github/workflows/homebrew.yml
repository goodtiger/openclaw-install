name: Update Homebrew Formula

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  homebrew:
    name: Bump Homebrew Formula
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts and compute SHA256
        id: checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"

          compute_sha256() {
            local os=$1
            local arch=$2
            local filename="openclaw-install_${VERSION}_${os}_${arch}.tar.gz"
            local url="https://github.com/${REPO}/releases/download/v${VERSION}/${filename}"
            echo "Downloading ${filename}..."
            curl -fsSL "$url" -o "$filename"
            local sha
            sha=$(sha256sum "$filename" | awk '{print $1}')
            echo "${os}_${arch}_sha256=$sha" >> "$GITHUB_OUTPUT"
            echo "${os}_${arch}: $sha"
          }

          compute_sha256 darwin arm64
          compute_sha256 darwin amd64
          compute_sha256 linux arm64
          compute_sha256 linux amd64

      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: goodtiger/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DARWIN_ARM64="${{ steps.checksums.outputs.darwin_arm64_sha256 }}"
          DARWIN_AMD64="${{ steps.checksums.outputs.darwin_amd64_sha256 }}"
          LINUX_ARM64="${{ steps.checksums.outputs.linux_arm64_sha256 }}"
          LINUX_AMD64="${{ steps.checksums.outputs.linux_amd64_sha256 }}"

          FORMULA="tap/Formula/openclaw-install.rb"

          cat > "$FORMULA" <<'RUBY'
class OpenclawInstall < Formula
  desc "OpenClaw installer for China region — network-optimized installation and configuration"
  homepage "https://github.com/goodtiger/openclaw-install"
  version "VERSION_PLACEHOLDER"
  license "MIT"

  on_macos do
    on_arm do
      url "https://github.com/goodtiger/openclaw-install/releases/download/vVERSION_PLACEHOLDER/openclaw-install_VERSION_PLACEHOLDER_darwin_arm64.tar.gz"
      sha256 "DARWIN_ARM64_PLACEHOLDER"
    end
    on_intel do
      url "https://github.com/goodtiger/openclaw-install/releases/download/vVERSION_PLACEHOLDER/openclaw-install_VERSION_PLACEHOLDER_darwin_amd64.tar.gz"
      sha256 "DARWIN_AMD64_PLACEHOLDER"
    end
  end

  on_linux do
    on_arm do
      url "https://github.com/goodtiger/openclaw-install/releases/download/vVERSION_PLACEHOLDER/openclaw-install_VERSION_PLACEHOLDER_linux_arm64.tar.gz"
      sha256 "LINUX_ARM64_PLACEHOLDER"
    end
    on_intel do
      url "https://github.com/goodtiger/openclaw-install/releases/download/vVERSION_PLACEHOLDER/openclaw-install_VERSION_PLACEHOLDER_linux_amd64.tar.gz"
      sha256 "LINUX_AMD64_PLACEHOLDER"
    end
  end

  livecheck do
    url :stable
    regex(/^v?(\d+(?:\.\d+)*)$/i)
  end

  def install
    bin.install "openclaw-install"
  end

  test do
    assert_match version.to_s, shell_output("#{bin}/openclaw-install version")
  end
end
RUBY

          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" "$FORMULA"
          sed -i "s/DARWIN_ARM64_PLACEHOLDER/${DARWIN_ARM64}/g" "$FORMULA"
          sed -i "s/DARWIN_AMD64_PLACEHOLDER/${DARWIN_AMD64}/g" "$FORMULA"
          sed -i "s/LINUX_ARM64_PLACEHOLDER/${LINUX_ARM64}/g" "$FORMULA"
          sed -i "s/LINUX_AMD64_PLACEHOLDER/${LINUX_AMD64}/g" "$FORMULA"

      - name: Commit and push
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/openclaw-install.rb
          git commit -m "openclaw-install ${{ steps.version.outputs.version }}"
          git push
